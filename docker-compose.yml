# Local PostgreSQL for development and tests.
# Two databases: clinic_db (dev) and clinic_db_test (Vitest integration tests).
services:
  postgres:
    image: postgres:17-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_password
      POSTGRES_DB: clinic_db
    ports:
      - '5433:5432'
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinic -d clinic_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinic_pgdata:
